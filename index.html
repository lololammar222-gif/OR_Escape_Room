<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الـ Escape Room - الإتيكيت والبروتوكول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شاشة البداية -->
    <div class="game-container" id="start-screen">
        <div class="character-box">
            <span class="avatar">🕵️‍♂️</span>
        </div>
        <h1>مرحباً بك في تحدي الـ Escape Room!</h1>
        <p>ادخل اسمك واجمع أرقام الكود للهروب من الغرفة:</p>
        <input type="text" id="player-name" placeholder="اكتب اسمك هنا...">
        <button class="btn main-btn" onclick="startGame()">ابدأ المغامرة 🚀</button>
    </div>

    <!-- شاشة اللعبة -->
    <div class="game-container" id="game-screen" style="display: none;">
        
        <!-- شريط التقدم العلوي -->
        <div class="progress-header">
            <span id="stage-counter">المحطة 1 من 10</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="character-box">
            <span class="avatar" id="avatar-emoji">🧐</span>
        </div>

        <h2 id="room-title"></h2>
        <p id="scenario-text"></p>

        <div class="options-container" id="options-container">
            <button class="btn opt-btn" data-key="أ"></button>
            <button class="btn opt-btn" data-key="ب"></button>
            <button class="btn opt-btn" data-key="ج"></button>
            <button class="btn opt-btn" data-key="د"></button>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <!-- شاشة الخزنة والنتيجة النهائية -->
    <div class="game-container" id="safe-screen" style="display: none;">
        <div class="character-box">
            <span class="avatar" id="safe-avatar">🔓</span>
        </div>
        
        <h2 id="safe-title">فتحت الخزنة!</h2>
        
        <div class="safe-box">
            <p>الكود الخاص بك للهروب هو:</p>
            <div class="secret-code" id="generated-code">--------</div>
        </div>

        <p class="final-score" id="final-score-text"></p>
        <p class="final-message" id="final-message-text"></p>

        <button class="btn main-btn" onclick="location.reload()">إعادة اللعب 🔄</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
