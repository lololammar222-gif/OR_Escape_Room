
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OR Escape Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="tag">YLY • OR COMMITTEE</p>
      <h1>OR ESCAPE ROOM</h1>
      <h2>SAVE THE EVENT</h2>
    </header>

    <section id="startScreen" class="panel">
      <h2>🚨 مهمتك بدأت!</h2>
      <p>جاوب على 10 أسئلة واجمع أعلى سكور تقدر عليه.</p>
      <label for="playerName">اكتب اسمك</label>
      <input id="playerName" type="text" maxlength="60"
        placeholder="اسمك هنا">
      <button id="startBtn">START MISSION 🚀</button>
      <p id="startError"></p>
    </section>

    <section id="gameScreen" class="panel hidden">
      <div class="stats">
        <span id="questionCount">السؤال 1 من 10</span>
        <span id="score">السكور: 0/10</span>
      </div>
      <div class="progress">
        <div id="progressBar"></div>
      </div>
      <h2 id="questionTitle"></h2>
      <div id="answers"></div>
      <p id="feedback"></p>
      <button id="nextBtn" disabled>السؤال التالي ←</button>
    </section>

    <section id="resultScreen" class="panel hidden">
      <h2 id="resultTitle"></h2>
      <p id="finalScore"></p>
      <p id="resultMessage"></p>
      <h3>YOUR SECRET CODE</h3>
      <div id="secretCode"></div>
      <button id="copyBtn">نسخ الكود 📋</button>
      <p id="copyFeedback"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
